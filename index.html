<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Barbería</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6f62"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f6f3;--card:#fff;--tx:#222;--mu:#8a8a85;--ac:#2f6f62;--acl:#e3efec;--bd:#e8e6e1;--rd:#c0453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#eee;--mu:#999;--ac:#6fbfae;--acl:#27403a;--bd:#333;--rd:#e5786d}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#eee;--mu:#999;--ac:#6fbfae;--acl:#27403a;--bd:#333;--rd:#e5786d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,sans-serif;max-width:480px;margin:auto;padding:16px 16px 96px}
h1{font-size:22px;margin:8px 0 14px}h2{font-size:15px;color:var(--mu);font-weight:600;margin:18px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .c{text-align:center;padding:12px 6px;margin:0}
.big{font-size:19px;font-weight:700}.red{color:var(--rd)}.grn{color:var(--ac)}
button,input,select{font:inherit;color:var(--tx)}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;width:100%;font-weight:600}
.b.s{background:var(--acl);color:var(--ac)}.b.w{width:auto;padding:8px 12px;font-size:14px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}nav button{flex:1;background:none;border:0;padding:10px 0;font-size:12px;color:var(--mu)}nav button b{display:block;font-size:20px}nav .on{color:var(--ac);font-weight:700}
.sh{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh>div{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{padding:9px 0;border-radius:10px;font-size:14px}
.cal .d{background:var(--card);border:1px solid var(--bd)}.cal .t{border-color:var(--ac)}.cal .sel{background:var(--ac);color:#fff}.cal .has::after{content:"•";display:block;line-height:4px;font-size:16px}
.bar{height:8px;background:var(--acl);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.bk{background:none;border:0;color:var(--ac);padding:0 0 8px;font-weight:600}
</style></head><body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
let db={clients:[],movs:[],turnos:[],barbers:[],shifts:[],cfg:{goal:5,benefit:"Corte gratis",price:0}};
let DB=null,ready=false,status="",last={};
function save(){try{localStorage.setItem("barberia",JSON.stringify(db));status="✓ Guardado en este teléfono"}catch(e){status="⚠ No se pudo guardar"}const el=$("#st");if(el)el.textContent=status}
function load(){try{const l=JSON.parse(localStorage.getItem("barberia"));if(l)db=Object.assign(db,l)}catch(e){}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 status="✓ Guardado en este teléfono";ready=true;render()}
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const money=n=>"$"+Math.round(n).toLocaleString("es-AR");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cl=id=>db.clients.find(c=>c.id===id);
const cname=id=>cl(id)?cl(id).name:"Sin cliente";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inc=m=>m.type!=="fiado";
let tab="home",sel=today(),cm=new Date(),openC=null,openB=null,rep=false,rp={p:"d",d:today()},hd=today(),eqRep=false,hp={p:"d",d:today()};
const tabs=[["home","💵","Caja"],["ag","📅","Turnos"],["cli","👤","Clientes"],["pts","⭐","Puntos"],["eq","👥","Equipo"],["dat","💾","Datos"]];

function sum(from,to){return db.movs.filter(m=>inc(m)&&m.date>=from&&m.date<=to).reduce((a,m)=>a+m.amount,0)}
function ranges(){const n=new Date(),t=iso(n),dow=(n.getDay()+6)%7,w=new Date(n);w.setDate(n.getDate()-dow);
 return{t,w:iso(w),m:t.slice(0,8)+"01"}}
const ab=id=>(cl(id)&&cl(id).ab)||{d:0,s:0,c:0};
function debt(id){return ab(id).d+db.movs.filter(m=>m.clientId===id).reduce((a,m)=>a+(m.type==="fiado"?m.amount:m.type==="pago"?-m.amount:0),0)}
function spent(id){return ab(id).s+db.movs.filter(m=>m.clientId===id&&m.type!=="pago").reduce((a,m)=>a+m.amount,0)}
function cuts(id){return ab(id).c+db.movs.filter(m=>m.clientId===id&&m.corte).length}
const pts=c=>cuts(c.id)-(c.pu!=null?c.pu:(c.redeemed||0)*db.cfg.goal);
const avail=c=>Math.floor(pts(c)/db.cfg.goal);
function ptsCard(c,name){const g=db.cfg.goal,p=pts(c),a=avail(c),r=p%g;
 return`<div class="c">${name?`<div class="row"><b>${esc(c.name)}</b><span class="big grn">⭐ ${p}</span></div>`:`<div class="row"><span class="mu">Puntos acumulados</span><span class="big grn">⭐ ${p}</span></div>`}
 <div class="bar"><i style="width:${a>0?100:r/g*100}%"></i></div>
 ${a>0?`<div class="row"><span class="grn">🎁 Puede canjear ${a} beneficio${a>1?"s":""} (${esc(db.cfg.benefit)})</span><button class="b w" onclick="redeem('${c.id}')">Canjear</button></div>`:`<span class="mu">Faltan ${g-r} punto${g-r>1?"s":""} para: ${esc(db.cfg.benefit)}</span>`}
 ${c.redeemed?`<div class="mu" style="margin-top:6px">Ya canjeó ${c.redeemed} vez${c.redeemed>1?"ces":""}</div>`:""}</div>`}

function form(title,fields,ok,pv){
 const h=document.createElement("div");h.className="sh";
 h.innerHTML=`<div><div class="row"><b>${title}</b><button class="bk" id="x">Cerrar</button></div>`+fields.map(f=>`<label>${f.l}</label>`+(f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==f.v?" selected":""}>${o[1]}</option>`).join("")}</select>`:`<input id="f_${f.k}" type="${f.t||"text"}" value="${esc(f.v)}"${f.t==="number"?' inputmode="decimal"':""}>`)).join("")+(pv?`<div class="c row" style="background:var(--acl)"><span>Total a cobrar</span><b id="pv"></b></div>`:"")+`<button class="b" id="ok">Guardar</button></div>`;
 const upd=()=>{if(!pv)return;const v={};fields.forEach(f=>v[f.k]=h.querySelector("#f_"+f.k).value.trim());$("#pv").textContent=money(pv(v))};
 h.oninput=upd;h.onchange=upd;setTimeout(upd);
 document.body.appendChild(h);
 h.onclick=e=>{if(e.target===h)h.remove()};$("#x").onclick=()=>h.remove();
 $("#ok").onclick=()=>{const v={};fields.forEach(f=>v[f.k]=h.querySelector("#f_"+f.k).value.trim());if(ok(v)!==false){h.remove();save();render()}};
}
const clientOpts=(blank)=>[...(blank?[["","Sin cliente"]]:[]),...db.clients.map(c=>[c.id,c.name])];

const calc=v=>{const a=parseFloat(v.a)||0,d=parseFloat(v.dv)||0;return Math.max(0,v.dt2==="p"?a-a*d/100:v.dt2==="m"?a-d:a)};
function newMov(type,clientId){
 const T={cobro:"Registrar cobro",fiado:"Servicio a cuenta (fiado)",pago:"Pago de deuda"}[type];
 form(T,[{k:"c",l:"Cliente",o:clientOpts(type==="cobro"),v:clientId||""},{k:"d",l:"Concepto",v:type==="pago"?"Pago":"Corte"},...(type!=="pago"&&db.barbers.some(b=>!b.off)?[{k:"b",l:"Barbero",o:barberOpts(),v:db.cfg.lastB||""}]:[]),{k:"a",l:type==="pago"?"Monto":"Precio",t:"number",v:type==="pago"?"":(db.cfg.price||"")},
  ...(type!=="pago"?[{k:"dt2",l:"Descuento",o:[["n","Sin descuento"],["p","Porcentaje (%)"],["m","Monto ($)"]],v:"n"},{k:"dv",l:"Valor del descuento",t:"number"}]:[]),{k:"dt",l:"Fecha",t:"date",v:today()},
  ...(type!=="pago"?[{k:"cut",l:"¿Cuenta como corte para puntos?",o:[["1","Sí"],["0","No"]],v:"1"}]:[])],v=>{
  const a=parseFloat(v.a);if(!a||a<=0){alert("Ingresá un monto");return false}
  if(type!=="cobro"&&!v.c){alert("Elegí un cliente");return false}
  const fin=type==="pago"?a:calc(v);if(v.b!==undefined)db.cfg.lastB=v.b;
  db.movs.push({id:uid(),date:v.dt||today(),clientId:v.c,barberId:v.b||"",concept:v.d,amount:fin,gross:a,type,corte:v.cut==="1"&&!!v.c})},type!=="pago"?calc:null);
}
function newClient(c){
 form(c?"Editar cliente":"Nuevo cliente",[{k:"n",l:"Nombre",v:c&&c.name},{k:"p",l:"Teléfono",t:"tel",v:c&&c.phone},{k:"a",l:"Dirección",v:c&&c.address},{k:"b",l:"Cumpleaños",t:"date",v:c&&c.bday}],v=>{
  if(!v.n){alert("Ingresá el nombre");return false}
  if(c)Object.assign(c,{name:v.n,phone:v.p,address:v.a,bday:v.b});else db.clients.push({id:uid(),name:v.n,phone:v.p,address:v.a,bday:v.b,redeemed:0})});
}
function newTurno(){
 if(!db.clients.length){alert("Primero cargá un cliente");return}
 form("Nuevo turno · "+sel.split("-").reverse().join("/"),[{k:"c",l:"Cliente",o:clientOpts()},...(db.barbers.some(b=>!b.off)?[{k:"b",l:"Barbero",o:barberOpts(),v:db.cfg.lastB||""}]:[]),{k:"h",l:"Hora",t:"time",v:"10:00"},{k:"s",l:"Servicio",v:"Corte"}],v=>{
  if(!v.h){alert("Elegí la hora");return false}
  if(db.turnos.some(t=>t.date===sel&&t.time===v.h&&(t.barberId||"")===(v.b||""))&&!confirm("Ya hay un turno a esa hora. ¿Guardar igual?"))return false;
  if(v.b!==undefined)db.cfg.lastB=v.b;db.turnos.push({id:uid(),date:sel,time:v.h,clientId:v.c,barberId:v.b||"",service:v.s})});
}

function home(){if(rep)return informe();const r=ranges(),k=[["Hoy",sum(r.t,r.t)],["Semana",sum(r.w,r.t)],["Mes",sum(r.m,r.t)]];
 const last=db.movs.filter(m=>m.date===hd);
 return`<h1>Caja</h1><div class="grid">${k.map(x=>`<div class="c"><div class="mu">${x[0]}</div><div class="big">${money(x[1])}</div></div>`).join("")}</div>
 <div class="c row"><div><div class="mu">Precio del corte</div><div class="big">${db.cfg.price?money(db.cfg.price):"Sin definir"}</div></div><button class="b s w" onclick="price()">Editar</button></div>
 <button class="b s" style="margin-top:10px" onclick="rep=true;render()">📊 Informe de ventas</button>
 <h2>Registrar</h2><button class="b" onclick="newMov('cobro')">+ Cobro</button>
 <div class="row" style="margin-top:8px"><button class="b s" onclick="newMov('fiado')">Fiado</button><button class="b s" onclick="newMov('pago')">Pago deuda</button></div>
 <h2>Movimientos del día</h2><input type="date" value="${hd}" onchange="hd=this.value||today();render()">${last.map(m=>`<div class="c row"><div>${esc(m.concept)}<div class="mu">${cname(m.clientId)} · ${m.date.split("-").reverse().join("/")}${m.type==="fiado"?" · fiado":""}${dn(m)}${m.barberId?" · ✂ "+esc(bname(m.barberId)):""}</div></div><div style="text-align:right"><b class="${m.type==="fiado"?"red":"grn"}">${money(m.amount)}</b><div style="margin-top:6px"><button class="b s w" onclick="editMov('${m.id}')">Editar</button> <button class="b s w" onclick="delMov('${m.id}')">✕</button></div></div></div>`).join("")||'<p class="mu">Sin movimientos este día.</p>'}`}

function agenda(){const y=cm.getFullYear(),mo=cm.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate();
 let cells="LMXJVSD".split("").map(d=>`<span class="mu">${d}</span>`).join("")+"<span></span>".repeat(first);
 for(let d=1;d<=n;d++){const s=iso(new Date(y,mo,d));cells+=`<span class="d ${s===today()?"t":""} ${s===sel?"sel":""} ${db.turnos.some(t=>t.date===s)?"has":""}" onclick="sel='${s}';render()">${d}</span>`}
 const ts=db.turnos.filter(t=>t.date===sel).sort((a,b)=>a.time.localeCompare(b.time));
 const mn=cm.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
 return`<h1>Turnos</h1><div class="row" style="margin-bottom:10px"><button class="b s w" onclick="cm=new Date(${y},${mo-1},1);render()">‹</button><b style="text-transform:capitalize">${mn}</b><button class="b s w" onclick="cm=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">${cells}</div>
 <h2>${sel.split("-").reverse().join("/")}</h2>${ts.map(t=>`<div class="c row"><div><b>${t.time}</b> · ${esc(cname(t.clientId))}<div class="mu">${esc(t.service)}${t.barberId?" · ✂ "+esc(bname(t.barberId)):""}</div></div><button class="b s w" onclick="db.turnos=db.turnos.filter(x=>x.id!=='${t.id}');save();render()">Quitar</button></div>`).join("")||'<p class="mu">Sin turnos este día.</p>'}
 <button class="b" onclick="newTurno()">+ Reservar turno</button>`}

function clients(){
 if(openC){const c=cl(openC);if(!c){openC=null;return clients()}const d=debt(c.id),ms=db.movs.filter(m=>m.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  return`<button class="bk" onclick="openC=null;render()">‹ Clientes</button><h1>${esc(c.name)}</h1>
  <div class="c mu">📞 ${esc(c.phone)||"-"}<br>📍 ${esc(c.address)||"-"}<br>🎂 ${c.bday?c.bday.split("-").reverse().join("/"):"-"}</div>
  <div class="grid"><div class="c"><div class="mu">Gastó</div><div class="big">${money(spent(c.id))}</div></div><div class="c"><div class="mu">${d>0?"Debe":"Saldo"}</div><div class="big ${d>0?"red":"grn"}">${money(Math.abs(d))}</div></div><div class="c"><div class="mu">Puntos</div><div class="big grn">⭐ ${pts(c)}</div></div></div>
  ${ptsCard(c)}
  <h2>Cuenta corriente</h2><div class="row"><button class="b s" onclick="newMov('fiado','${c.id}')">+ Fiado</button><button class="b s" onclick="newMov('pago','${c.id}')">+ Pago</button></div>
  <button class="b s" style="margin-top:8px" onclick="newClient(cl('${c.id}'))">Editar datos</button>
  ${ms.map(m=>`<div class="c row" style="margin-top:8px"><div>${esc(m.concept)}<div class="mu">${m.date.split("-").reverse().join("/")} · ${{cobro:"cobrado",fiado:"a cuenta",pago:"pago"}[m.type]}${dn(m)}</div></div><b class="${m.type==="fiado"?"red":"grn"}">${m.type==="pago"?"-":""}${money(m.amount)}</b></div>`).join("")}`}
 return`<h1>Clientes</h1><button class="b" onclick="newClient()">+ Nuevo cliente</button><h2>${db.clients.length} registrados</h2>`+
 [...db.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const d=debt(c.id);return`<div class="c row" onclick="openC='${c.id}';render()"><div>${esc(c.name)}<div class="mu">${esc(c.phone)}</div></div>${d>0?`<b class="red">${money(d)}</b>`:'<span class="mu">›</span>'}</div>`}).join("")}

function points(){const g=db.cfg.goal;
 return`<h1>Puntos</h1><div class="c row"><div><b>${g} puntos = ${esc(db.cfg.benefit)}</b><div class="mu">Cada corte suma 1 punto. Se acumulan y se canjean cuando quieras.</div></div><button class="b s w" onclick="cfg()">Editar</button></div>
 <h2>Clientes</h2>`+[...db.clients].sort((a,b)=>pts(b)-pts(a)).map(c=>ptsCard(c,1)).join("")}
function price(){form("Precio del corte",[{k:"p",l:"Precio predeterminado",t:"number",v:db.cfg.price||""}],v=>{const p=parseFloat(v.p);if(isNaN(p)||p<0)return false;db.cfg.price=p})}
const dn=m=>m.gross&&m.gross>m.amount?` · desc. ${money(m.gross-m.amount)}`:"";
async function dl(name,data){try{const u=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){alert("No se pudo descargar");return false}}
const stamp=()=>today();
function datos(){const n=db.movs.length;
 return`<h1>Datos</h1><div class="c mu">${db.clients.length} clientes · ${n} movimientos · ${db.turnos.length} turnos</div>
 <h2>Suscripción</h2><div class="c"><div class="row"><span class="mu">Código de cliente</span><b>${lic.id}</b></div><div class="row" style="margin-top:6px"><span class="mu">${PUB?(left()>=0?"Activa hasta":"Venció el"):"Sin control de suscripción"}</span><b>${PUB?fd(validUntil()):""}</b></div>${PUB?`<button class="b s" style="margin-top:10px" onclick="renewForm()">Ingresar clave de renovación</button>`:""}</div>
 <h2>Copia de seguridad</h2><div class="c"><p class="mu" style="margin-top:0">Los datos viven en este teléfono. Descargá una copia seguido y guardala en Drive o WhatsApp.</p><button class="b" onclick="backup()">Descargar copia completa</button></div>
 <div class="c"><p class="mu" style="margin-top:0">Recupera los datos desde una copia descargada antes (por ejemplo, de la versión anterior o si cambiás de celular).</p><input type="file" accept=".json,application/json" onchange="restore(this)"></div>
 <h2>Caja en Excel</h2><div class="c"><p class="mu" style="margin-top:0">Todos los movimientos en un archivo CSV que se abre con Excel.</p><button class="b s" onclick="csv()">Descargar caja (CSV)</button></div>
 <h2>Archivar meses viejos</h2><div class="c"><p class="mu" style="margin-top:0">Descarga los cobros y turnos antiguos y los saca de la app para liberar espacio. Las deudas, el gasto y los cortes de cada cliente se conservan. Los totales de caja de esos meses dejan de verse.</p><button class="b s" onclick="archive()">Archivar</button></div>`}
const backup=()=>dl("barberia-copia-"+stamp()+".json",JSON.stringify({version:1,fecha:stamp(),db},null,1));
const q=t=>'"'+String(t||"").replace(/"/g,'""')+'"';
function csv(){const rows=[["Fecha","Cliente","Concepto","Tipo","Precio","Descuento","Total","Barbero"]].concat([...db.movs].sort((a,b)=>a.date.localeCompare(b.date)).map(m=>[m.date,cname(m.clientId),m.concept,m.type,m.gross||m.amount,(m.gross||m.amount)-m.amount,m.amount,bname(m.barberId)]));
 dl("caja-"+stamp()+".csv","\ufeff"+rows.map(r=>r.map(q).join(";")).join("\n"))}
function archive(){
 form("Archivar meses viejos",[{k:"m",l:"Archivar todo lo anterior a",o:[["24","Hace más de 24 meses"],["12","Hace más de 12 meses"],["6","Hace más de 6 meses"]],v:"12"}],v=>{
  const d=new Date();d.setMonth(d.getMonth()-parseInt(v.m));const cut=iso(d).slice(0,8)+"01";
  const om=db.movs.filter(m=>m.date<cut),ot=db.turnos.filter(t=>t.date<cut);
  if(!om.length&&!ot.length){alert("No hay datos tan antiguos.");return false}
  if(!confirm("Se archivarán "+om.length+" movimientos y "+ot.length+" turnos anteriores a "+cut.split("-").reverse().join("/")+". Primero se descarga el archivo y después se borran de la app."))return false;
  dl("barberia-archivo-hasta-"+cut+".json",JSON.stringify({version:1,antesDe:cut,movs:om,turnos:ot,clientes:db.clients},null,1)).then(ok=>{
   if(!ok){alert("No se archivó nada porque no se descargó el archivo.");return}
   om.forEach(m=>{const c=cl(m.clientId);if(!c)return;c.ab=c.ab||{d:0,s:0,c:0};if(m.type==="fiado")c.ab.d+=m.amount;if(m.type==="pago")c.ab.d-=m.amount;if(m.type!=="pago")c.ab.s+=m.amount;if(m.corte)c.ab.c++});
   db.movs=db.movs.filter(m=>m.date>=cut);db.turnos=db.turnos.filter(t=>t.date>=cut);save();render();alert("Listo: datos archivados.")});
  return true})}

 <h2>${lbl} · tocá un barbero para ver o editar sus horas</h2>${L.map(x=>`<div class="c" onclick="eqRep=false;openB='${x.b.id}';render()"><div class="row"><b>✂ ${esc(x.b.name)}</b><b class="grn">${x.b.pay?money(x.p):""}</b></div><div class="mu">${fh(x.h)} · ${x.d} día${x.d==1?"":"s"} · ventas ${money(x.v)}</div><div class="mu">Pago: ${payTxt(x.b)}</div></div>`).join("")||'<p class="mu">Todavía no hay barberos.</p>'}
 <button class="b" style="margin-top:12px" onclick="exportEq()">Exportar a Excel</button>`}
function exportEq(){const[f,t]=rango(hp),L=eqRows(f,t),H=x=>[x,1],$=n=>[n,2],B=n=>[n,3],d2=m=>Math.round(m/60*100)/100;
 const res=[["Horas y pagos del equipo - Barbería"],["Desde",fd(f)],["Hasta",fd(t)],[],[H("Barbero"),H("Horas"),H("Días trabajados"),H("Ventas"),H("Forma de pago"),H("A pagar")],...L.map(x=>[x.b.name,d2(x.h),x.d,$(x.v),payTxt(x.b),$(Math.round(x.p))]),["TOTAL",d2(sm(L,x=>x.h)),"",B(sm(L,x=>x.v)),"",B(Math.round(sm(L,x=>x.p)))]];
 const det=[[H("Fecha"),H("Barbero"),H("Entrada"),H("Salida"),H("Horas")],...db.shifts.filter(x=>x.date>=f&&x.date<=t).sort((a,b)=>(a.date+a.in).localeCompare(b.date+b.in)).map(x=>[fd(x.date),bname(x.barberId),x.in,x.out||"sin salida",d2(dur(x))])];
 dl("horas-y-pagos-"+{d:"dia",w:"semana",m:"mes"}[hp.p]+"-"+f+".xlsx",xlsxBlob([["Resumen",res],["Horas por día",det]]))}

const PUB=null;
const TRIAL=7;
let lic=null,lockMsg="";
const dys=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const addD=(a,n)=>{const d=new Date(a+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const licSave=()=>{try{localStorage.setItem("barberia_lic",JSON.stringify(lic))}catch(e){}};
function licInit(){const t=today();try{lic=JSON.parse(localStorage.getItem("barberia_lic"))}catch(e){lic=null}
 if(!lic||!lic.id){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(6));lic={id:[...r].map(x=>A[x%32]).join(""),inst:t,until:null,seen:t};licSave()}}
const validUntil=()=>{const tr=addD(lic.inst,TRIAL);return lic.until&&lic.until>tr?lic.until:tr};
const left=()=>dys(today(),validUntil());
function licTick(){const t=today();lockMsg=lic.seen>t&&dys(t,lic.seen)>1?"La fecha del teléfono no es correcta. Corregila para continuar.":"";if(!lockMsg&&lic.seen<t){lic.seen=t;licSave()}}
const isLocked=()=>!!(lockMsg||left()<0);
const b64=x=>Uint8Array.from(atob(x.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function activate(tok){const m=$("#lm"),say=t=>{if(m)m.textContent=t;else alert(t)};
 try{const p=String(tok).trim().split(".");if(p.length!==3)throw"Clave inválida";const[id,u,sg]=p;
  if(id!==lic.id)throw"Esta clave es de otro dispositivo";
  const d=u.slice(0,4)+"-"+u.slice(4,6)+"-"+u.slice(6,8);
  const k=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
  if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,b64(sg),new TextEncoder().encode(id+"."+u)))throw"Clave inválida";
  if(d<today())throw"Esta clave ya venció";
  if(!lic.until||d>lic.until)lic.until=d;licSave();render();if(!m)alert("Listo. Suscripción activa hasta el "+fd(lic.until))
 }catch(e){say(typeof e==="string"?e:"Clave inválida")}}
const lockHtml=()=>`<div style="text-align:center;margin-top:8vh"><div style="font-size:48px">🔒</div><h1>${lockMsg?"Fecha incorrecta":"Suscripción vencida"}</h1><p class="mu">${lockMsg||"Para seguir usando la app, pedí tu clave de activación. Tus datos están guardados y no se pierden."}</p><div class="c"><div class="mu">Tu código de cliente</div><div class="big" style="font-size:30px;letter-spacing:4px">${lic.id}</div></div><div style="text-align:left"><label>Clave de activación</label><input id="lk" placeholder="Pegá la clave acá" autocapitalize="off" autocomplete="off"></div><button class="b" onclick="activate($('#lk').value)">Activar</button><p id="lm" class="red"></p></div>`;
const banner=()=>PUB&&left()>=0&&left()<=5?`<div class="c" style="background:var(--acl)">⏳ Tu suscripción vence ${left()==0?"hoy":"en "+left()+" día"+(left()==1?"":"s")}. Pedí tu clave para renovar.</div>`:"";
const renewForm=()=>form("Renovar suscripción",[{k:"k",l:"Clave de activación"}],v=>{activate(v.k)});
function cfg(){form("Configurar beneficio",[{k:"g",l:"Puntos necesarios por beneficio",t:"number",v:db.cfg.goal},{k:"b",l:"Beneficio",v:db.cfg.benefit}],v=>{const g=parseInt(v.g);if(!g||g<1)return false;db.cfg=Object.assign(db.cfg,{goal:g,benefit:v.b||"Beneficio"})})}
function redeem(id){if(confirm("¿Canjear "+db.cfg.benefit+" para "+cname(id)+"?")){{const c=cl(id);c.pu=(c.pu!=null?c.pu:(c.redeemed||0)*db.cfg.goal)+db.cfg.goal;c.redeemed=(c.redeemed||0)+1}save();render()}}

function render(){
 if(!ready){$("#app").innerHTML='<p class="mu" style="text-align:center;margin-top:40vh">Cargando…</p>';return}
 licTick();if(PUB&&isLocked()){$("#nav").innerHTML="";$("#app").innerHTML=lockHtml();return}
 $("#app").innerHTML=banner()+{home,ag:agenda,cli:clients,pts:points,eq:equipo,dat:datos}[tab]()+`<p class="mu" id="st" style="text-align:center;margin-top:18px">${status}</p>`;
 $("#nav").innerHTML=tabs.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';openC=null;openB=null;rep=false;eqRep=false;render();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join("");
}
licInit();render();load();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
